services:

  vllm:
    build:
      context: .
      dockerfile: Dockerfile.vLLM
    command: ["zai-org/GLM-OCR", "--allowed-local-media-path", "/", "--port", "8080", "--gpu-memory-utilization", "0.95", "--max-model-len", "4096", "--enforce-eager"]
    # --enforce-eager — desactiva CUDA graphs, liberando ~0.32 GiB adicionales, La GPU no tiene memoria suficiente para el KV cache después de cargar el modelo y los CUDA graphs
    ports:
      - "8080:8080"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s   # model download can take several minutes

  api:
      build:
        context: .
        dockerfile: Dockerfile.api
      ports:
        - "8088:8088"
      environment:
        - VLLM_URL=http://vllm:8080
      depends_on:
        vllm:
          condition: service_healthy
